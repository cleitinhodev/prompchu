name: Release biblioteca beta
# Build and test database and shelf features on all supported desktops.
on:
  push:
    branches: [teste-biblioteca]
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tests/smoke_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Example database and JSON
        run: |
          python scripts/make_examples.py
          cp examples/prompts-demo.sqlite3 release/prompts-demo.sqlite3
          cp assets/demo-prompts.json release/prompts-demo.json
      - name: Checksums
        working-directory: release
        run: sha256sum Prompchu-* prompts-demo.* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          TAG="v${VERSION}"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Prompchu $VERSION — Biblioteca beta" --notes-file RELEASE_NOTES.md --prerelease --latest=false --draft
          gh release edit "$TAG" --draft=false
