name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'testes/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test persistence
        run: python -m unittest discover -s tests -v
      - name: Test interface
        run: python tests/smoke_ui.py
      - name: Build
        run: python scripts/build_windows.py
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Prompchu-Windows64
          path: dist/Prompchu/
          if-no-files-found: error
          retention-days: 30
